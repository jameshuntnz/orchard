name: CI

# Main and pull requests. Orchard is pure Go — the macOS-specific parts are deployment,
# not code — so this runs in a Linux container rather than occupying one of the node's
# two macOS VM slots.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A pull request from a fork does not run here.
    #
    # This repository builds on a self-hosted runner, and image:go means the runner
    # builds .sapling/images/go/Dockerfile from the job's own commit — a build that
    # happens on the host, outside the job container. A fork's pull request could
    # therefore execute code on the node by editing that file, which is the documented
    # behaviour rather than a hole to patch here.
    #
    # So fork pull requests get no checks at all, deliberately. A maintainer can run
    # them by pushing the branch to this repository.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository

    # image:go carries the toolchain and a C compiler; see .sapling/images/go/Dockerfile.
    runs-on: [self-hosted, linux, arm64, image:go]
    # A self-hosted job queues indefinitely when no runner matches, so cap it rather
    # than letting a run hang until someone notices.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # A Linux job shares no cache between runs, and tsnet pulls a large dependency
      # tree, so the module cache is worth restoring even though the toolchain is baked.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Go version
        run: go version

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # The release pipeline derives its version from commit messages, so the derivation
      # is checked here rather than discovered at release time.
      - name: Version derivation
        run: ./scripts/test-next-version.sh

      # -race is why the image carries gcc.
      - run: go test ./... -race

      # The service is deployed as a darwin/arm64 binary; prove that target still links.
      - name: build release targets
        run: |
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/orchard
          done

      - name: shell scripts
        run: |
          for s in scripts/*.sh deploy/*.sh; do
            bash -n "$s" || exit 1
          done
          echo "shell syntax ok"
